<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" fill="none">
  <defs>
    <linearGradient id="bg-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber-m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#991B1B" />
      <stop offset="50%" style="stop-color:#D97706" />
      <stop offset="100%" style="stop-color:#FBBF24" />
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg-m)" rx="8"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#amber-m)" opacity="0.4"/>

  <g font-family="'SF Mono', 'Fira Code', monospace" text-anchor="middle">
    <!-- Metric 1 -->
    <text x="150" y="55" fill="#FBBF24" font-size="38" font-weight="700">6</text>
    <text x="150" y="80" fill="#F8FAFC" font-size="10" font-weight="600">AI AGENTS</text>
    <text x="150" y="95" fill="#94A3B8" font-size="8">Simultaneous</text>

    <!-- Metric 2 -->
    <text x="350" y="55" fill="#D97706" font-size="38" font-weight="700">~850</text>
    <text x="350" y="80" fill="#F8FAFC" font-size="10" font-weight="600">MS LATENCY</text>
    <text x="350" y="95" fill="#94A3B8" font-size="8">Round-trip</text>

    <!-- Metric 3 -->
    <text x="550" y="55" fill="#FBBF24" font-size="38" font-weight="700">6</text>
    <text x="550" y="80" fill="#F8FAFC" font-size="10" font-weight="600">DOMAINS</text>
    <text x="550" y="95" fill="#94A3B8" font-size="8">Interview fields</text>

    <!-- Metric 4 -->
    <text x="750" y="55" fill="#D97706" font-size="38" font-weight="700">FSIR</text>
    <text x="750" y="80" fill="#F8FAFC" font-size="10" font-weight="600">PDF REPORTS</text>
    <text x="750" y="95" fill="#94A3B8" font-size="8">Auto-generated</text>

    <!-- Metric 5 -->
    <text x="950" y="55" fill="#FBBF24" font-size="38" font-weight="700">DQI</text>
    <text x="950" y="80" fill="#F8FAFC" font-size="10" font-weight="600">SCORING</text>
    <text x="950" y="95" fill="#94A3B8" font-size="8">FAANG-calibrated</text>

    <!-- Metric 6 -->
    <text x="1100" y="55" fill="#D97706" font-size="38" font-weight="700">40</text>
    <text x="1100" y="80" fill="#F8FAFC" font-size="10" font-weight="600">MIN MAX</text>
    <text x="1100" y="95" fill="#94A3B8" font-size="8">Interview length</text>
  </g>

  <!-- Separator line -->
