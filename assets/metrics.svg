    <text x="170" y="146" text-anchor="middle" fill="#D97706">🎙️ Real-Time Voice</text>

    <rect x="270" y="130" width="170" height="24" rx="12" fill="#991B1B" fill-opacity="0.1" stroke="#991B1B" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="355" y="146" text-anchor="middle" fill="#FBBF24">🛡️ Resume Verification</text>

    <rect x="460" y="130" width="180" height="24" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="550" y="146" text-anchor="middle" fill="#D97706">🧠 Dynamic Questions</text>

    <rect x="660" y="130" width="150" height="24" rx="12" fill="#991B1B" fill-opacity="0.1" stroke="#991B1B" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="735" y="146" text-anchor="middle" fill="#FBBF24">🕵️ Integrity Traps</text>

    <rect x="830" y="130" width="140" height="24" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="900" y="146" text-anchor="middle" fill="#D97706">📊 FSIR Reports</text>

    <!-- Row 2 -->
    <rect x="200" y="165" width="170" height="24" rx="12" fill="#991B1B" fill-opacity="0.1" stroke="#991B1B" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="285" y="181" text-anchor="middle" fill="#FBBF24">⚡ Crisis Injection</text>

    <rect x="390" y="165" width="175" height="24" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="477" y="181" text-anchor="middle" fill="#D97706">👁️ Behavioral Biometrics</text>

    <rect x="585" y="165" width="155" height="24" rx="12" fill="#991B1B" fill-opacity="0.1" stroke="#991B1B" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="662" y="181" text-anchor="middle" fill="#FBBF24">🤖 Avatar Interview</text>

    <rect x="760" y="165" width="160" height="24" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="840" y="181" text-anchor="middle" fill="#D97706">🔐 GitHub OSINT</text>
  </g>

  <rect x="0" y="219" width="1200" height="1" fill="url(#amber-m)" opacity="0.4"/>
