<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <!-- Amber Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:0" />
    </radialGradient>
    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#D97706" stroke-opacity="0.04" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#D97706" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <!-- Hex Pattern -->
    <pattern id="hexgrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="#FBBF24" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#hexgrid)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Top Border -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#shield-grad)" opacity="0.6"/>

  <!-- Circuit Lines Left -->
  <g stroke="#D97706" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 0 200 H 100 L 130 170 H 200"/>
    <path d="M 0 220 H 80 L 110 250 H 180"/>
    <path d="M 0 180 H 60 L 90 150 H 160"/>
    <circle cx="200" cy="170" r="3" fill="#D97706" fill-opacity="0.3"/>
    <circle cx="180" cy="250" r="3" fill="#FBBF24" fill-opacity="0.3"/>
    <circle cx="160" cy="150" r="3" fill="#991B1B" fill-opacity="0.3"/>
  </g>

  <!-- Circuit Lines Right -->
  <g stroke="#D97706" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 1200 200 H 1100 L 1070 170 H 1000"/>
    <path d="M 1200 220 H 1120 L 1090 250 H 1020"/>
    <path d="M 1200 180 H 1140 L 1110 150 H 1040"/>
    <circle cx="1000" cy="170" r="3" fill="#D97706" fill-opacity="0.3"/>
    <circle cx="1020" cy="250" r="3" fill="#FBBF24" fill-opacity="0.3"/>
    <circle cx="1040" cy="150" r="3" fill="#991B1B" fill-opacity="0.3"/>
  </g>

  <!-- Floating Nodes -->
  <g fill-opacity="0.06">
    <circle cx="250" cy="80" r="60" fill="#D97706"/>
    <circle cx="950" cy="320" r="80" fill="#991B1B"/>
    <circle cx="150" cy="340" r="40" fill="#FBBF24"/>
    <circle cx="1050" cy="60" r="50" fill="#D97706"/>
  </g>

  <!-- Shield Icon -->
  <g transform="translate(540, 60)">
    <path d="M 60 0 L 120 30 L 120 75 C 120 120 90 150 60 165 C 30 150 0 120 0 75 L 0 30 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="2.5" opacity="0.8"/>
    <path d="M 60 15 L 108 39 L 108 72 C 108 108 84 132 60 144 C 36 132 12 108 12 72 L 12 39 Z" 
          fill="#D97706" fill-opacity="0.08"/>
    <!-- Inner forge symbol -->
    <g transform="translate(35, 50)" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 25 0 L 50 15 L 50 45 L 25 60 L 0 45 L 0 15 Z"/>
      <line x1="25" y1="0" x2="25" y2="60"/>
      <line x1="0" y1="15" x2="50" y2="45"/>
      <line x1="50" y1="15" x2="0" y2="45"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="270" text-anchor="middle" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="48" font-weight="700" letter-spacing="8">AEGIS FORGE</text>
  
  <!-- Subtitle -->
  <text x="600" y="305" text-anchor="middle" fill="#D97706" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" letter-spacing="4">AI-POWERED TECHNICAL INTERVIEW SIMULATION PLATFORM</text>

  <!-- Bottom tagline -->
  <text x="600" y="345" text-anchor="middle" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" letter-spacing="2">MULTI-AGENT ORCHESTRATION · REAL-TIME VOICE · FAANG-GRADE EVALUATION</text>

  <!-- Bottom Border -->
  <rect x="0" y="398" width="1200" height="2" fill="url(#shield-grad)" opacity="0.6"/>

  <!-- Corner Accents -->
  <g stroke="#D97706" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 0 30 L 0 0 L 30 0"/>
    <path d="M 1170 0 L 1200 0 L 1200 30"/>
    <path d="M 0 370 L 0 400 L 30 400"/>
    <path d="M 1170 400 L 1200 400 L 1200 370"/>
  </g>
</svg>
